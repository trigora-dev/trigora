name: release

on:
  push:
    tags: ['v1.0.0']

jobs:
  package:
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: trigora-dev/tcc-engine
          ref: v26.10.2
          path: tcc-engine
      - uses: actions/download-artifact@v7
        with:
          name: trigora-1.0.0
          path: dist
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          set -euo pipefail
          publish() {
            local name="$1"
            local attempt=1
            local output status
            while true; do
              set +e
              output=$(cargo publish -p "$name" 2>&1)
              status=$?
              set -e
              printf '%s\n' "$output"
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              if printf '%s\n' "$output" | grep -Eiq 'already exists|already uploaded'; then
                return 0
              fi
              if ! printf '%s\n' "$output" | grep -Eiq 'failed to select a version|no matching package named'; then
                return "$status"
              fi
              if [ "$attempt" -ge 20 ]; then
                echo "crates.io did not index a dependency of ${name}" >&2
                return "$status"
              fi
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          publish trigora-local
          publish trigora-cli
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish npm packages
        run: |
          set -euo pipefail
          publish() {
            local pkg="$1"
            local output status
            # A path with a slash and no leading ./ is a GitHub repo spec to npm.
            test -f "$pkg"
            set +e
            output=$(npm publish "./$pkg" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if printf '%s\n' "$output" | grep -Eiq 'previously published|EPUBLISHCONFLICT'; then
              return 0
            fi
            return "$status"
          }
          publish dist/trigora-contracts-1.0.0.tgz
          publish dist/trigora-1.0.0.tgz
      - name: Stage the CLI wheel
        run: |
          mkdir -p wheelhouse
          cp dist/trigora_cli-*.whl wheelhouse/
      - name: Publish the CLI wheel
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
          attestations: false
          skip-existing: true
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
