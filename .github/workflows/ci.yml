name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: trigora-dev/tcc-engine
          path: tcc-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: pack engine frontends
        working-directory: tcc-engine
        run: |
          pnpm install
          pnpm pack:js
          mkdir -p "$GITHUB_WORKSPACE/dist-packages"
          cp dist-packages/*.tgz "$GITHUB_WORKSPACE/dist-packages/" || true
          cp dist-packages/*.whl "$GITHUB_WORKSPACE/dist-packages/" || true
      - run: pnpm install
      - name: test local runtime
        run: cargo test -p trigora-local
      - name: test cli
        run: cargo test -p trigora-cli
      - name: vendor linux binaries
        run: |
          cargo build --release -p trigora-local
          cargo build --release -p trigora-cli
          mkdir -p packages/cli/vendor/trigora-local/linux-x64
          mkdir -p packages/cli/vendor/trigora/linux-x64
          mkdir -p packages/cli/vendor/tcc-rust-compile/linux-x64
          cp target/release/trigora-local packages/cli/vendor/trigora-local/linux-x64/trigora-local
          cp target/release/trigora packages/cli/vendor/trigora/linux-x64/trigora
          cp target/release/tcc-rust-compile packages/cli/vendor/tcc-rust-compile/linux-x64/tcc-rust-compile
          chmod +x packages/cli/vendor/trigora-local/linux-x64/trigora-local
          chmod +x packages/cli/vendor/trigora/linux-x64/trigora
          chmod +x packages/cli/vendor/tcc-rust-compile/linux-x64/tcc-rust-compile
      - run: pnpm typecheck
      - run: pnpm test

  python-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff setuptools wheel
      - run: ruff check python/trigora-cli
      - run: ruff format --check python/trigora-cli
      - run: PYTHONPATH=src python3 tests/test_cli.py
        working-directory: python/trigora-cli
