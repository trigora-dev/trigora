name: Pulse production smoke

# Unpublished Phase 6E check. Dispatch only. It does not tag, push GHCR, or
# create a GitHub Release. The native linux/amd64 runner is the architecture
# gate. Apple Silicon emulation is not.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-amd64:
    if: github.repository == 'trigora-dev/trigora'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: trigora-dev/tcc-engine
          ref: v26.10.4
          path: tcc-engine
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the adapter dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the production-token smoke
        env:
          TRIGORA_TOKEN: ${{ secrets.TRIGORA_TOKEN }}
        run: |
          if [ -z "${TRIGORA_TOKEN}" ]; then
            echo "TRIGORA_TOKEN is not set in the release environment." >&2
            exit 2
          fi
          unset TRIGORA_PULSE_AUTHORITY_URL
          unset TRIGORA_PULSE_WORKSPACE_ID
          unset TRIGORA_PULSE_WORKSPACE_TOKEN
          unset PULSE_IMAGE_PLATFORM
          ./release/pulse/production-smoke.sh
