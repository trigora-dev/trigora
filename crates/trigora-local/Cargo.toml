[package]
name = "trigora-local"
version = "0.9.0"
edition = "2021"
publish = false
description = "Local Trigora runtime over the SQLite TCC host"

[[bin]]
name = "trigora-local"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tcc-host = { path = "../../tcc-engine/crates/tcc-host" }
tcc-host-sqlite = { path = "../../tcc-engine/crates/tcc-host-sqlite" }
tcc-state = { path = "../../tcc-engine/crates/tcc-state" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tcc-ir = { path = "../../tcc-engine/crates/tcc-ir" }
