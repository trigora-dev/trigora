[package]
name = "trigora-pulse"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/trigora-dev/trigora"
description = "Trigora Pulse host"

[[bin]]
name = "trigora-pulse"
path = "src/main.rs"

[[bench]]
name = "stage"
harness = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tcc-core = { version = "26.10.4", path = "../../tcc-engine/crates/tcc-core" }
tcc-host = { version = "26.10.4", path = "../../tcc-engine/crates/tcc-host" }
tcc-ir = { version = "26.10.4", path = "../../tcc-engine/crates/tcc-ir" }
tcc-state = { version = "26.10.4", path = "../../tcc-engine/crates/tcc-state" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
