[package]
name = "trigora-cli"
version = "0.9.0"
edition = "2021"
publish = false
description = "Trigora command line"

[[bin]]
name = "trigora"
path = "src/main.rs"

[[bin]]
name = "tcc-rust-compile"
path = "src/bin/tcc-rust-compile.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.2"
libc = "0.2"
notify = "6"
regex = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
# Local `cargo install --path crates/trigora-cli` installs `trigora` and
# `tcc-rust-compile` side by side. A later `cargo install trigora-cli` from
# crates.io still needs `tcc-rust-frontend` to be a published crate or another
# Cargo-legal release dependency. That publish step is out of scope.
tcc-rust-frontend = { path = "../../tcc-engine/frontends/rust" }
tcc-ir = { path = "../../tcc-engine/crates/tcc-ir" }

[dev-dependencies]
serde_json = "1"
