[package]
name = "trigora-cli"
version = "1.0.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/trigora-dev/trigora"
description = "Trigora command line"

[[bin]]
name = "trigora"
path = "src/main.rs"

[[bin]]
name = "trigora-local"
path = "src/bin/trigora-local.rs"

[[bin]]
name = "tcc-rust-compile"
path = "src/bin/tcc-rust-compile.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.2"
libc = "0.2"
notify = "6"
regex = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
# `cargo install trigora-cli` installs trigora, trigora-local, and tcc-rust-compile.
# version plus path keeps local builds on the checkout and packaged builds on crates.io.
trigora-local = { version = "1.0.0", path = "../trigora-local" }
tcc-core = { version = "26.10.2", path = "../../tcc-engine/crates/tcc-core" }
tcc-host = { version = "26.10.2", path = "../../tcc-engine/crates/tcc-host" }
tcc-host-sqlite = { version = "26.10.2", path = "../../tcc-engine/crates/tcc-host-sqlite" }
tcc-ir = { version = "26.10.2", path = "../../tcc-engine/crates/tcc-ir" }
tcc-rust-frontend = { version = "26.10.2", path = "../../tcc-engine/frontends/rust" }
tcc-state = { version = "26.10.2", path = "../../tcc-engine/crates/tcc-state" }

[dev-dependencies]
serde_json = "1"
