[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trigora"
version = "0.9.0"
description = "Authoring SDK and HTTP client for Trigora durable programs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Trigora" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://trigora.dev"

[tool.setuptools.packages.find]
where = ["src"]
